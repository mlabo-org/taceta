[package]
name = "taceta"
version = "0.1.0"
edition = "2024"
description = "A quiet native macOS client for local intelligence"
license = "MIT"
repository = "https://github.com/mlabo-org/taceta"
rust-version = "1.92"

[dependencies]
eframe = { version = "=0.34.1", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu"] }
pulldown-cmark = "=0.13.4"
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
eventsource-stream = "0.2.3"
futures-util = "0.3"
rfd = "0.15"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "stream", "form", "rustls"] }
serde_json = "1.0"
sys-locale = "0.3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs", "net"] }
libc = "0.2"
sha2 = "0.10"
tracing = "0.1"
zeroize = "1.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
url = "2.5"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tempfile = "3"
